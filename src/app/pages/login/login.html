<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h2>DOTS frags</h2>
      <small>Inventory & Dashboard</small>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" [(ngModel)]="username" placeholder="Enter username"
        (keyup.enter)="submit()" [disabled]="loading" autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" [(ngModel)]="password" placeholder="Enter password"
        (keyup.enter)="submit()" [disabled]="loading">
    </div>
    <button class="btn btn-primary w-100" (click)="submit()" [disabled]="loading">
      <span *ngIf="loading">Logging in...</span>
      <span *ngIf="!loading">Login</span>
    </button>
  </div>
</div>
